<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGlow)"/>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1200" height="64" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Logo -->
  <circle cx="40" cy="32" r="14" fill="url(#accentGrad)"/>
  <polygon points="36,25 47,32 36,39" fill="#ffffff"/>
  <text x="66" y="38" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="-0.5">Mastery Academy</text>
  <rect x="235" y="22" width="82" height="22" rx="11" fill="#1e293b"/>
  <text x="247" y="37" fill="#94a3b8" font-size="11" font-weight="600">LMS v2.4</text>

  <!-- Search / Top Actions -->
  <rect x="360" y="16" width="380" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="380" cy="32" r="6" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="384" y1="36" x2="390" y2="42" stroke="#64748b" stroke-width="2"/>
  <text x="402" y="37" fill="#64748b" font-size="13">Search courses, chapters, resources...</text>

  <!-- User / CTA -->
  <rect x="940" y="16" width="130" height="32" rx="8" fill="url(#accentGrad)"/>
  <text x="965" y="37" fill="#ffffff" font-size="13" font-weight="600">+ New Course</text>
  <circle cx="1110" cy="32" r="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="1104" y="37" fill="#38bdf8" font-size="13" font-weight="700">NM</text>
  <circle cx="1122" cy="42" r="4" fill="#10b981"/>

  <!-- Sidebar -->
  <rect x="0" y="64" width="260" height="611" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  
  <text x="24" y="100" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">CURRICULUM TREE</text>
  
  <!-- Active Chapter Item -->
  <rect x="12" y="115" width="236" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="34" cy="136" r="8" fill="#10b981"/>
  <path d="M30 136 L33 139 L39 133" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="52" y="135" fill="#f8fafc" font-size="13" font-weight="600">01. Architecture Overview</text>
  <text x="52" y="148" fill="#94a3b8" font-size="10">14 min · Video Completed</text>

  <!-- Chapter 2 -->
  <rect x="12" y="165" width="236" height="42" rx="8" fill="transparent"/>
  <circle cx="34" cy="186" r="8" fill="url(#accentGrad)"/>
  <polygon points="32,182 38,186 32,190" fill="#ffffff"/>
  <text x="52" y="185" fill="#e2e8f0" font-size="13" font-weight="600">02. Distributed Data Stores</text>
  <text x="52" y="198" fill="#38bdf8" font-size="10">22 min · Now Playing</text>

  <!-- Chapter 3 -->
  <rect x="12" y="215" width="236" height="42" rx="8" fill="transparent"/>
  <circle cx="34" cy="236" r="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="31" y="240" fill="#94a3b8" font-size="10" font-weight="700">3</text>
  <text x="52" y="235" fill="#94a3b8" font-size="13" font-weight="500">03. High-Throughput Auth</text>
  <text x="52" y="248" fill="#64748b" font-size="10">18 min · Locked</text>

  <!-- Chapter 4 -->
  <rect x="12" y="265" width="236" height="42" rx="8" fill="transparent"/>
  <circle cx="34" cy="286" r="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="31" y="290" fill="#94a3b8" font-size="10" font-weight="700">4</text>
  <text x="52" y="285" fill="#94a3b8" font-size="13" font-weight="500">04. Video Pipelines &amp; CDN</text>
  <text x="52" y="298" fill="#64748b" font-size="10">31 min · Locked</text>

  <!-- Progress Box in Sidebar -->
  <rect x="16" y="520" width="228" height="110" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="32" y="546" fill="#f8fafc" font-size="13" font-weight="600">Course Progress</text>
  <text x="195" y="546" fill="#10b981" font-size="13" font-weight="700">68%</text>
  <rect x="32" y="560" width="196" height="6" rx="3" fill="#1e293b"/>
  <rect x="32" y="560" width="133" height="6" rx="3" fill="url(#emeraldGrad)"/>
  <text x="32" y="590" fill="#94a3b8" font-size="11">14 of 22 Chapters Done</text>
  <text x="32" y="608" fill="#64748b" font-size="10">Certificate ready upon completion</text>

  <!-- Main Content Area -->
  <g transform="translate(280, 80)">
    <!-- Video Player Frame -->
    <rect x="0" y="0" width="880" height="380" rx="12" fill="#020617" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Video Canvas Mockup -->
    <rect x="12" y="12" width="856" height="356" rx="8" fill="#0b1329"/>
    
    <!-- Code / Slide on Video -->
    <g transform="translate(40, 40)">
      <text x="0" y="24" fill="#38bdf8" font-size="13" font-family="monospace">// Distributed Edge Infrastructure Blueprint</text>
      <text x="0" y="56" fill="#f8fafc" font-size="24" font-weight="700">Scaling Next.js Microservices to 10M+ Requests</text>
      <rect x="0" y="80" width="400" height="2" fill="url(#accentGrad)"/>

      <!-- Blueprint nodes -->
      <rect x="0" y="110" width="140" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="16" y="135" fill="#f8fafc" font-size="12" font-weight="600">Edge Middleware</text>
      <text x="16" y="152" fill="#38bdf8" font-size="10">Global TTFB 0.8s</text>

      <line x1="140" y1="140" x2="200" y2="140" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
      
      <rect x="200" y="110" width="150" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="216" y="135" fill="#f8fafc" font-size="12" font-weight="600">Prisma / PostgreSQL</text>
      <text x="216" y="152" fill="#10b981" font-size="10">Read-Replicas Active</text>
    </g>

    <!-- Video Controls Bar -->
    <rect x="12" y="328" width="856" height="40" rx="0" fill="#000000" fill-opacity="0.7"/>
    <!-- Play button -->
    <polygon points="34,342 44,348 34,354" fill="#ffffff"/>
    <!-- Scrubber -->
    <rect x="60" y="346" width="680" height="4" rx="2" fill="#334155"/>
    <rect x="60" y="346" width="310" height="4" rx="2" fill="#3b82f6"/>
    <circle cx="370" cy="348" r="6" fill="#ffffff"/>
    <text x="760" y="352" fill="#94a3b8" font-size="11" font-family="monospace">14:22 / 22:45</text>
    <rect x="830" y="340" width="26" height="16" rx="4" fill="#1e293b"/>
    <text x="834" y="352" fill="#38bdf8" font-size="10" font-weight="700">4K</text>

    <!-- Details Below Video -->
    <g transform="translate(0, 400)">
      <!-- Title & Action -->
      <text x="0" y="24" fill="#f8fafc" font-size="20" font-weight="700">02. Distributed Data Stores &amp; Connection Pooling</text>
      <text x="0" y="46" fill="#94a3b8" font-size="13">Architected by Niall.M · Principal Engineering Masterclass</text>

      <rect x="680" y="6" width="200" height="38" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <path d="M700 25 L705 30 L715 19" fill="none" stroke="#10b981" stroke-width="2"/>
      <text x="725" y="30" fill="#10b981" font-size="13" font-weight="600">Mark as Completed</text>

      <!-- Stats Bento -->
      <g transform="translate(0, 70)">
        <rect x="0" y="0" width="270" height="70" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="28" fill="#64748b" font-size="11" font-weight="600">STUDENT ENROLLMENTS</text>
        <text x="16" y="54" fill="#f8fafc" font-size="20" font-weight="700">1,842 Active</text>
        <text x="180" y="54" fill="#10b981" font-size="12" font-weight="600">+24% MoM</text>

        <rect x="290" y="0" width="270" height="70" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
        <text x="306" y="28" fill="#64748b" font-size="11" font-weight="600">COMPLETION RATE</text>
        <text x="306" y="54" fill="#f8fafc" font-size="20" font-weight="700">92.4% SLA</text>
        <text x="470" y="54" fill="#38bdf8" font-size="12" font-weight="600">High</text>

        <rect x="580" y="0" width="300" height="70" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
        <text x="596" y="28" fill="#64748b" font-size="11" font-weight="600">STREAMING LATENCY</text>
        <text x="596" y="54" fill="#f8fafc" font-size="20" font-weight="700">&lt; 85ms TTFB</text>
        <text x="750" y="54" fill="#10b981" font-size="12" font-weight="600">Edge Cached</text>
      </g>
    </g>
  </g>
</svg>
